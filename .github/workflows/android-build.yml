# Building the Android app without a computer.
#
# `eas build` normally means a terminal, Node, and a checkout — none of which
# exist on a phone. This runs it on GitHub's machines instead, started from a
# button on the Actions tab, which is a web page that works fine on a phone.
#
# Setup, once:
#   1. expo.dev -> your account -> Access tokens -> create one, copy it.
#   2. This repository -> Settings -> Secrets and variables -> Actions
#      -> New repository secret -> name EXPO_TOKEN, paste the token.
#   3. Actions tab -> "Build Android app" -> Run workflow -> paste the API URL.
#
# The token belongs in that secret and nowhere else: not in this file, not in a
# commit, not in a chat message.
name: Build Android app

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Deployed API, including /api/v1 (e.g. https://raket-api-xxxx.onrender.com/api/v1)"
        required: true
        type: string
      profile:
        description: "preview = installable APK, production = Play Store bundle"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    # The EAS project id is committed back on the first run — see "Link the EAS
    # project" below — so the link survives the runner being thrown away.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      # Fails the run immediately on a URL that cannot work, rather than
      # spending twenty minutes of build time to produce an app that opens and
      # reaches nothing. `app.config.ts` refuses a missing URL; these are the
      # two ways a URL that IS set is still wrong.
      - name: Check the API URL
        working-directory: .
        run: |
          url="${{ inputs.api_url }}"

          case "$url" in
            https://*) ;;
            *)
              echo "::error::The API URL must start with https:// — a release build cannot use plain HTTP."
              exit 1
              ;;
          esac

          case "$url" in
            */api/v1|*/api/v1/) ;;
            *)
              echo "::error::The API URL must end with /api/v1. Got: $url"
              exit 1
              ;;
          esac

          echo "Building against $url"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      # Catches a type error here, where it costs a minute, instead of inside
      # the EAS build, where it costs twenty.
      - name: Typecheck
        run: npx tsc --noEmit

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # `eas build` needs a project that exists under the Expo account, and
      # `eas init` normally asks for it interactively — which a robot token
      # cannot answer. So it is created here, non-interactively, once.
      #
      # The id is COMMITTED BACK to app.json. Without that the runner's
      # checkout is thrown away at the end of the job and the next run would
      # create a second project, then a third: one per build, all with the same
      # name, and no way to tell which one a build landed in.
      - name: Link the EAS project
        run: |
          current=$(node -p "require('./app.json').expo.extra?.eas?.projectId || ''")

          if [ -n "$current" ]; then
            echo "Already linked to project $current"
            exit 0
          fi

          echo "No project id in app.json — creating one under the configured owner."
          eas init --account "$(node -p "require('./app.json').expo.owner")" --non-interactive

          created=$(node -p "require('./app.json').expo.extra?.eas?.projectId || ''")

          if [ -z "$created" ]; then
            echo "::error::eas init did not write a project id into app.json."
            exit 1
          fi

          echo "Created and linked project $created"
          {
            echo "### EAS project linked"
            echo ""
            echo "Project id \`$created\` has been committed to \`mobile/app.json\`."
            echo "Future builds reuse it, so this step will not run again."
          } >> "$GITHUB_STEP_SUMMARY"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json
          git commit -m "Link the EAS project ($created)"
          git push origin HEAD:${{ github.ref_name }}

      # The URL has to be written into eas.json, not just exported here.
      #
      # `eas build` uploads the project and the build runs on Expo's machines,
      # which do not inherit this runner's environment — only what the profile
      # declares. The first attempt exported EXPO_PUBLIC_API_URL as a step env
      # and the EAS worker still re-read app.config.ts without it, so the
      # guard there refused the build. Which was the guard doing its job: the
      # alternative was an APK that installs, opens, and looks for the API on
      # the phone itself.
      #
      # eas.json already carries the deployed URL as its default, so a build
      # run by hand works too. This only overwrites it when the workflow was
      # given a different one.
      - name: Point the build at the API
        env:
          API_URL: ${{ inputs.api_url }}
          PROFILE: ${{ inputs.profile }}
        run: |
          node -e '
            const fs = require("fs");
            const json = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            const profile = process.env.PROFILE;

            json.build[profile] = json.build[profile] || {};
            json.build[profile].env = {
              ...(json.build[profile].env || {}),
              EXPO_PUBLIC_API_URL: process.env.API_URL,
            };

            fs.writeFileSync("eas.json", JSON.stringify(json, null, 2) + "\n");
            console.log(`${profile} profile will build against ${process.env.API_URL}`);
          '

      - name: EAS build
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait

      - name: Where to get it
        run: |
          echo "### Build queued" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "EAS is building it now. The download link appears at" >> "$GITHUB_STEP_SUMMARY"
          echo "<https://expo.dev/accounts> -> your project -> Builds." >> "$GITHUB_STEP_SUMMARY"
          echo "Android builds usually take 15-30 minutes." >> "$GITHUB_STEP_SUMMARY"
