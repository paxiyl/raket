# ============================================================================
# CURRENT. This blueprint is how Raket is deployed.
#
# It was briefly marked superseded in favour of Northflank (NORTHFLANK.md).
# That migration is PREPARED BUT NOT DONE: Northflank asked for a payment
# method that is not available, and its free plan offers no region nearer than
# London — ~7,200 km from the Mumbai Atlas cluster, against ~3,900 km from
# Singapore here. So Render stays, in Singapore, and keeps the better latency.
#
# NORTHFLANK.md, the root Dockerfile and .dockerignore are kept and are ready
# to use. They are a prepared alternative, not dead weight, and they are also
# the escape hatch if Render's free plan changes. Do not delete them.
#
# THE SPIN-DOWN IS HANDLED OUTSIDE THIS FILE. A free web service sleeps after
# ~15 minutes idle and the next request waits about a minute. The fix in use is
# an external uptime pinger against /health, which fits inside the free monthly
# instance-hour budget. It is configuration in someone else's dashboard and
# cannot be expressed here — see DEPLOYMENT.md section Keeping the free
# service awake, which also covers the arithmetic and the caveats.
#
# VITE_GOOGLE_CLIENT_ID is now declared below. Its absence was the reason the
# admin Google button never rendered: VITE_* is read at BUILD time and compiled
# into the bundle, so a blueprint that does not declare it produces a bundle
# with no client id, no matter how the server is configured.
# ============================================================================

# Render blueprint — one web service, two apps.
#
# WHY ONE SERVICE: the backoffice authenticates with an HTTP-only cookie, and
# the API serves the admin bundle so that cookie is same-origin. That keeps
# `SameSite=Lax` (not the third-party `None` browsers are phasing out), needs
# no CORS, needs no credentialed cross-origin preflight, and keeps the admin
# JWT out of JavaScript entirely. The customer mobile app is unaffected either
# way: it holds its token in the device keystore and sends it as a bearer
# header, so it talks to this same API over HTTPS from anywhere.
#
# It is still two separate applications with two separate front doors — the
# customer app on a phone, the backoffice in a browser at this service's URL —
# and one shared database behind both. "Separate origin" and "separate app" are
# not the same requirement, and only the second one is actually asked for here.
#
# FREE PLAN: a free web service spins down after about 15 minutes with no
# traffic, and the next request waits for it to boot — about a minute, and the
# database connection happens before it listens, so the wait is real. Both
# clients are built for that (see DEPLOYMENT.md § Cold starts), and an external
# pinger keeps the service awake during active hours (§ Keeping the free service
# awake). Free services have no uptime guarantee and a monthly instance-hour
# budget that the pinger eats into. Move to a paid instance before this carries
# real orders.
services:
  - type: web
    name: raket-api
    runtime: node
    plan: free
    # Closest free region to Hindaun. Change it before the first deploy if you
    # prefer another — it cannot be changed afterwards without recreating the
    # service.
    region: singapore
    # The repository root, not api/: the build needs both apps, and the API
    # resolves the admin bundle relative to its own dist/.
    rootDir: .
    buildCommand: bash ./render-build.sh
    # `cd api` rather than `npm start --prefix api`, because `node dist/index.js`
    # is resolved against the working directory.
    startCommand: cd api && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # Render injects PORT and the app reads it. Do not set it here.

      # ---- Secrets. Enter these in the Render dashboard, never in this file.
      # `sync: false` means "ask me, and keep it out of the blueprint".
      - key: MONGODB_URI
        sync: false

      # Generated once by Render, 256 bits of randomness, and never shown in a
      # commit or a log. Changing it later signs every session out, which is a
      # feature when a key is suspected and a surprise otherwise.
      - key: JWT_SECRET
        generateValue: true

      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      # Server-side only. It must never appear in a VITE_* or EXPO_PUBLIC_*
      # variable — those are compiled into code that ships to devices.
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ---- Optional integrations. Leave blank and the feature stays off; both
      # clients ask the server what is configured rather than assuming.

      # The WEB OAuth client id, read by the API at RUN time to verify the
      # audience of an incoming Google ID token. Never an Android client id:
      # those exist only so Google recognises the app by its SHA-1, and they
      # never appear in an audience. See GOOGLE_SIGNIN_SETUP.md.
      - key: GOOGLE_CLIENT_IDS
        sync: false

      # The SAME web client id again, for the admin bundle.
      #
      # READ AT BUILD TIME, NOT AT RUN TIME. Vite compiles VITE_* into the
      # JavaScript it emits, and render-build.sh runs the admin build, so Render
      # must have this value when the BUILD runs. Changing it needs a redeploy,
      # not a restart — a restart reuses the bundle that was already built.
      #
      # admin/src/components/auth/google-sign-in-button.tsx opens with
      # `if (!CLIENT_ID) return null`, so an undeclared value renders nothing at
      # all, silently, however the server is configured. This blueprint not
      # declaring it is why the admin Google button has never appeared.
      #
      # Public by design: it ships inside the browser bundle. Still `sync: false`
      # so the value lives in the dashboard next to the runtime one it must
      # match, rather than being committed here and drifting from it.
      #
      # Leave it unset to keep the Google button hidden. That is a supported
      # state, not a broken one.
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      - key: LOG_LEVEL
        value: info

      # ---- The first administrator, when there is no shell to run
      # `npm run seed:admin` in (Render's shell is a paid feature). Set both,
      # deploy, sign in, then DELETE them. Minimum twelve characters. The boot
      # log warns on every start while they are still here.
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false

      # CORS_ORIGIN is deliberately absent. In this topology the backoffice is
      # same-origin, so no cross-origin allowance is needed, and an empty
      # allow-list is the safe default the API ships with. Set it only if you
      # later host the admin app somewhere else — and read DEPLOYMENT.md
      # § A separate admin origin first, because the cookie settings have to
      # change with it.
